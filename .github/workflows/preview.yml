name: Preview

# One preview per pull request to develop (map #86): a Cloudflare Workers Preview for the code,
# and a disposable Neon branch for the data (`preview/pr-<n>`, migrated and seeded, with a
# schema diff commented on the pull request). Both are removed when the pull request closes.
# `bun run db:preview:studio -- <n>` opens Drizzle Studio on that database.
#
# Off until the repository variable PREVIEW_ENABLED is "true" (secrets and the Worker entry
# must exist first). Pull requests from forks never get a preview or any secret (#89).
#
# Repository variables: PREVIEW_ENABLED, NEON_PROJECT_ID, NEON_PARENT_BRANCH, PREVIEW_DOMAIN
# Repository secrets (environment "preview"): CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
#   NEON_API_KEY, PREVIEW_BETTER_AUTH_SECRET, PREVIEW_OAUTH_PROXY_SECRET,
#   PREVIEW_{GITHUB,GITLAB,GOOGLE}_CLIENT_{ID,SECRET} (the staging OAuth apps, #100)
on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: write

# Deploy and cleanup of one pull request never overlap.
concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: false

env:
  PREVIEW_NAME: pr-${{ github.event.number }}
  PREVIEW_DOMAIN: ${{ vars.PREVIEW_DOMAIN || 'preview.codesphereplatform.xyz' }}

jobs:
  # The preview migrates a database and publishes a Worker: it starts only once CI and the
  # licence check of the same commit passed, never in parallel with them.
  gate:
    name: CI passed
    if: >
      github.event.action != 'closed' &&
      vars.PREVIEW_ENABLED == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
      - uses: ./.github/actions/wait-for-ci
        with:
          sha: ${{ github.event.pull_request.head.sha }}
          event: pull_request
          workflows: ci.yml licenses.yml

  # Stage 1, in parallel with the build: the disposable database of the pull request, migrated
  # and seeded. Blocking: a failed migration stops the deploy.
  database:
    name: Preview database
    needs: gate
    if: >
      github.event.action != 'closed' &&
      vars.PREVIEW_ENABLED == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: preview
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      # Retried: a cold cache re-downloads everything and can hit rate limits (infra, not code).
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            bun install --frozen-lockfile --ignore-scripts && exit 0
            echo "::warning::install attempt $attempt failed, retrying"
            sleep 15
          done
          exit 1
      - run: bun run env:generate

      # Neon Free allows 10 branches per project, parent branches included. Past that limit no
      # database can be created: stop here with a clear message, and create nothing (#147).
      - name: Check the Neon branch quota
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          BRANCH: preview/${{ env.PREVIEW_NAME }}
        run: |
          api="https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches"
          curl -sSf -H "Authorization: Bearer $NEON_API_KEY" "$api" > branches.json
          total=$(jq '.branches | length' branches.json)
          own=$(jq --arg n "$BRANCH" '[.branches[] | select(.name == $n)] | length' branches.json)
          echo "Neon branches in the project: $total of 10 (this preview's branch exists: $own)"
          if [ "$own" = "0" ] && [ "$total" -ge 10 ]; then
            echo "::error::Neon limit reached ($total/10 branches): no database is created for $PREVIEW_NAME. Close an older pull request or upgrade the Neon plan."
            exit 1
          fi

      # Safety net if the cleanup job never runs; a push does not extend it.
      - name: Expiry of the Neon branch
        id: expiry
        run: echo "at=$(date -u -d '+7 days' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Neon branch
        id: neon
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          parent_branch: ${{ vars.NEON_PARENT_BRANCH || 'staging' }}
          branch_name: preview/${{ env.PREVIEW_NAME }}
          expires_at: ${{ steps.expiry.outputs.at }}

      - name: Migrate the preview database
        working-directory: packages/db
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
        run: bunx drizzle-kit migrate

      # Idempotent: creates the CADEV 2026 once and never overwrites what an Admin edited (#61).
      - name: Seed the preview database
        working-directory: packages/db
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
        run: bun src/seed/index.ts

      # One comment per pull request, updated on each push: the schema this pull request's
      # migrations add to the parent branch. Informational, so it never blocks the deploy.
      - name: Comment the schema diff
        continue-on-error: true
        uses: neondatabase/schema-diff-action@v1
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          compare_branch: preview/${{ env.PREVIEW_NAME }}
          base_branch: ${{ vars.NEON_PARENT_BRANCH || 'staging' }}

  # Stage 2, in parallel with the database: the Worker, built once. It holds no secret (only
  # NEXT_PUBLIC_* values are inlined), so the artifact can travel between jobs.
  build:
    name: Build the Worker
    needs: gate
    if: >
      github.event.action != 'closed' &&
      vars.PREVIEW_ENABLED == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      # Retried: a cold cache re-downloads everything and can hit rate limits (infra, not code).
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            bun install --frozen-lockfile --ignore-scripts && exit 0
            echo "::warning::install attempt $attempt failed, retrying"
            sleep 15
          done
          exit 1
      - run: bun run env:generate

      - name: Build the Worker
        working-directory: apps/web
        env:
          # Inlined at build time, hence one build per pull request.
          NEXT_PUBLIC_SERVER_URL: https://${{ env.PREVIEW_NAME }}.${{ env.PREVIEW_DOMAIN }}
          # Every preview has its own Neon database (the database job): the app uses it.
          NEXT_PUBLIC_HAS_DATABASE: "true"
        # cf:build compiles the service worker (public/sw.js, #249) before OpenNext bundles the assets.
        run: bun run cf:build

      - uses: actions/upload-artifact@v4
        with:
          name: preview-worker-${{ env.PREVIEW_NAME }}
          path: apps/web/.open-next
          retention-days: 1
          if-no-files-found: error
          # .open-next is a dot directory: upload-artifact skips hidden files by default.
          include-hidden-files: true

  # Stage 3: publishes the built Worker against the migrated database, then checks it answers.
  # This is the check a pull request must pass before it can be merged.
  deploy:
    name: Deploy preview
    needs: [database, build]
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    # always(): a failed or skipped stage must turn THIS check red. Without it the job would be
    # skipped, and a skipped required check counts as passed for the merge rule.
    if: >
      always() &&
      github.event.action != 'closed' &&
      vars.PREVIEW_ENABLED == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: preview
    steps:
      - name: Require the database and the build
        env:
          DATABASE: ${{ needs.database.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          if [ "$DATABASE" != "success" ] || [ "$BUILD" != "success" ]; then
            echo "::error::Not deployed: database is '$DATABASE', build is '$BUILD'."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      # Retried: a cold cache re-downloads everything and can hit rate limits (infra, not code).
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            bun install --frozen-lockfile --ignore-scripts && exit 0
            echo "::warning::install attempt $attempt failed, retrying"
            sleep 15
          done
          exit 1
      - run: bun run env:generate

      - uses: actions/download-artifact@v4
        with:
          name: preview-worker-${{ env.PREVIEW_NAME }}
          path: apps/web/.open-next

      # A secret does not cross jobs (GitHub drops it from outputs): read the URL again.
      - name: Preview database URL
        id: neon
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          BRANCH: preview/${{ env.PREVIEW_NAME }}
        run: |
          url=$(bunx neonctl@2 connection-string "$BRANCH" --project-id "$PROJECT_ID" --api-key "$NEON_API_KEY")
          echo "::add-mask::$url"
          echo "db_url=$url" >> "$GITHUB_OUTPUT"

      - name: Deploy the Preview
        id: deploy
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ORIGIN: https://${{ env.PREVIEW_NAME }}.${{ env.PREVIEW_DOMAIN }}
          COMMIT: ${{ github.event.pull_request.head.sha }}
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
          BETTER_AUTH_SECRET: ${{ secrets.PREVIEW_BETTER_AUTH_SECRET }}
          OAUTH_PROXY_SECRET: ${{ secrets.PREVIEW_OAUTH_PROXY_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.PREVIEW_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.PREVIEW_GITHUB_CLIENT_SECRET }}
          GITLAB_CLIENT_ID: ${{ secrets.PREVIEW_GITLAB_CLIENT_ID }}
          GITLAB_CLIENT_SECRET: ${{ secrets.PREVIEW_GITLAB_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.PREVIEW_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.PREVIEW_GOOGLE_CLIENT_SECRET }}
        run: |
          # Secrets go through a file, never the command line; removed right after.
          umask 077
          node ../../scripts/preview-secrets.mjs preview-secrets.json
          # One origin for the web and the API: no CORS, first-party cookies. The staging
          # origin is the only callback URL the identity providers know (OAuth proxy, #98).
          bunx wrangler preview \
            --name "$PREVIEW_NAME" \
            --tag "$PREVIEW_NAME" \
            --message "$COMMIT" \
            --var "BETTER_AUTH_URL:$ORIGIN" \
            --var "CORS_ORIGIN:$ORIGIN" \
            --var "OAUTH_PROXY_PRODUCTION_URL:https://staging.codesphereplatform.xyz" \
            --secrets-file preview-secrets.json
          rm -f preview-secrets.json
          echo "url=$ORIGIN" >> "$GITHUB_OUTPUT"

      # wrangler preview succeeds even when the Preview has no reachable URL (missing route,
      # DNS or certificate still provisioning). Bot Fight Mode challenges GitHub runners and
      # cannot be bypassed on the free plan: a Cloudflare challenge (403 + cf-mitigated) still
      # proves DNS, certificate and routing work, though not that the API is ready.
      - name: Wait for the preview to be reachable
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        run: |
          for attempt in $(seq 1 30); do
            headers=$(curl -sS -m 10 -o /dev/null -D - "$PREVIEW_URL/api/v1/ready" || true)
            status=$(printf '%s' "$headers" | awk 'toupper($1) ~ /^HTTP/ {code=$2} END {print code}')
            if [ "${status:0:1}" = "2" ]; then
              echo "ready after $attempt attempt(s)"
              exit 0
            fi
            if [ "$status" = "403" ] && printf '%s' "$headers" | grep -qi '^cf-mitigated: *challenge'; then
              echo "::notice::reachable, readiness not checked: Cloudflare challenged the runner"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$PREVIEW_URL is not reachable after 5 minutes (last status: ${status:-none})"
          exit 1

      - name: Comment the preview URL
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const marker = '<!-- preview-url -->';
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = `${marker}\n**Preview:** ${process.env.PREVIEW_URL}\n\nCommit \`${sha}\`. Removed when this pull request closes.`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body?.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  # Stage 4: Lighthouse CI against the preview (#248, budgets of map #224). The budgets live in
  # apps/web/lighthouse/lib.cjs: LCP and initial JS fail the pull request at once, the other
  # budgets warn until 2 Nov 2026. The results are a table in the job summary and one PR comment.
  lighthouse:
    name: Lighthouse budgets
    needs: deploy
    if: >
      always() &&
      github.event.action != 'closed' &&
      needs.deploy.result == 'success' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: apps/web
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Bot Fight Mode challenges GitHub runners (see the reachability check above): the audit
      # would measure the challenge page, so it is skipped with a notice rather than faked.
      - name: Pick the pages to audit
        id: pages
        working-directory: apps/web
        env:
          PREVIEW_URL: ${{ needs.deploy.outputs.url }}
        run: |
          code=0
          urls=$(node lighthouse/run.cjs urls "$PREVIEW_URL") || code=$?
          if [ "$code" = "3" ]; then
            echo "::notice::Lighthouse budgets not checked: Cloudflare challenged the runner. Add a WAF skip rule for this job to enforce them."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" != "0" ]; then
            exit "$code"
          else
            echo "urls=$urls" >> "$GITHUB_OUTPUT"
          fi
      - name: Lighthouse CI (timings)
        if: steps.pages.outputs.skip != 'true'
        working-directory: apps/web
        env:
          LHCI_URLS: ${{ steps.pages.outputs.urls }}
        run: npx --yes @lhci/cli@0.15.1 autorun --config=lighthouserc.cjs
      # Weights are checked on compressed bytes, which lhci's own assertions do not do.
      - name: Report and check the weight budgets
        id: report
        if: always() && steps.pages.outputs.skip != 'true' && steps.pages.outcome == 'success'
        working-directory: apps/web
        run: |
          [ -f .lighthouseci/manifest.json ] || { echo "::error::Lighthouse produced no results"; exit 1; }
          code=0
          node lighthouse/run.cjs report > "$RUNNER_TEMP/lighthouse.md" || code=$?
          cat "$RUNNER_TEMP/lighthouse.md" >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
      - name: Comment the results
        if: always() && steps.pages.outputs.skip != 'true' && steps.report.outcome != 'skipped'
        uses: actions/github-script@v7
        env:
          REPORT: ${{ runner.temp }}/lighthouse.md
        with:
          script: |
            const fs = require('node:fs');
            // A crashed report leaves an empty file: keep the last good comment.
            if (!fs.existsSync(process.env.REPORT) || fs.statSync(process.env.REPORT).size === 0) return;
            const marker = '<!-- lighthouse -->';
            const body = `${marker}\n**Lighthouse budgets**\n\n${fs.readFileSync(process.env.REPORT, 'utf8')}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body?.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  cleanup:
    name: Remove preview
    if: >
      github.event.action == 'closed' &&
      vars.PREVIEW_ENABLED == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile --ignore-scripts

      # A failure here stays visible: a leftover preview must not go unnoticed (the Neon branch
      # below still runs, see if: always()).
      - name: Delete the Worker preview
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler preview delete --name "$PREVIEW_NAME" --skip-confirmation

      - name: Delete the Neon branch
        if: always()
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch: preview/${{ env.PREVIEW_NAME }}
