name: Staging

# Deploys develop to https://staging.codesphereplatform.xyz: the "codesphere-staging" Worker
# (wrangler env staging) on the Neon branch the previews fork from. Staging is the OAuth proxy
# production URL: the identity providers only know its callback (#100).
#
# Pipeline, same shape as the pull request previews (preview.yml):
#   gate     -> the commit's CI run (ci.yml) must have passed
#   database -> migrate and seed the staging database       (in parallel with build)
#   build    -> OpenNext build, handed to deploy as an artifact (build once, deploy that)
#   e2e      -> the three Playwright journeys on a local stack (e2e.yml, #55)
#   deploy   -> wrangler deploy, reachability check
# deploy needs database, build AND e2e, and fails explicitly when one did not succeed: a red CI, a
# failed migration, a failed build or a broken journey never reaches the Worker, and never shows
# up as « skipped ».
#
# Manual only (Actions > Staging > Run workflow, branch develop, or
# `gh workflow run staging.yml --ref develop`); the previews stay automatic. A push to develop
# does not deploy. The run refuses a commit whose CI did not pass.
#
# The Run workflow button needs this file on the default branch (main): GitHub registers
# workflow_dispatch from there. The run itself uses the file of the branch picked.
#
# Variables and secrets: docs/staging.md.
on:
  workflow_dispatch:

permissions:
  contents: read

# Deploys run one after the other; a newer run does not cancel a migration halfway.
concurrency:
  group: staging
  cancel-in-progress: false

env:
  ORIGIN: https://staging.codesphereplatform.xyz

jobs:
  # TEST: waits for the push run of ci.yml on this commit; fails when it failed, was cancelled,
  # or never ran. Blocking: nothing below starts without it.
  gate:
    name: CI passed
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
      - uses: ./.github/actions/wait-for-ci
        with:
          sha: ${{ github.sha }}
          event: push
          workflows: ci.yml

  # BUILD: once, on the commit the gate approved. The artifact is what gets deployed.
  build:
    name: Build the Worker
    needs: gate
    # Only develop is ever deployed to staging, whatever branch the run was started from.
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      # Retried: a cold cache re-downloads everything and can hit rate limits (infra, not code).
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            bun install --frozen-lockfile --ignore-scripts && exit 0
            echo "::warning::install attempt $attempt failed, retrying"
            sleep 15
          done
          exit 1
      - run: bun run env:generate
      - name: Build
        working-directory: apps/web
        env:
          NEXT_PUBLIC_SERVER_URL: ${{ env.ORIGIN }}
          # Inlined at build time; must match EMAIL_OTP_SIGNIN on the Worker (set at deploy below).
          NEXT_PUBLIC_EMAIL_OTP_SIGNIN: "true"
        run: bunx opennextjs-cloudflare build
      - uses: actions/upload-artifact@v4
        with:
          name: staging-worker
          path: apps/web/.open-next
          retention-days: 7
          if-no-files-found: error
          # .open-next is a dot directory: upload-artifact skips hidden files by default.
          include-hidden-files: true

  # E2E: the journeys must pass before staging changes (#55). In parallel with build.
  e2e:
    name: End-to-end journeys
    needs: gate
    if: github.ref == 'refs/heads/develop'
    uses: ./.github/workflows/e2e.yml

  # DATABASE: migrations and seed, in parallel with the build. Blocking on every step.
  database:
    name: Staging database
    needs: gate
    # Only develop is ever deployed to staging, whatever branch the run was started from.
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: preview
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      # Retried: a cold cache re-downloads everything and can hit rate limits (infra, not code).
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            bun install --frozen-lockfile --ignore-scripts && exit 0
            echo "::warning::install attempt $attempt failed, retrying"
            sleep 15
          done
          exit 1
      - run: bun run env:generate

      - name: Staging database URL
        id: neon
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          BRANCH: ${{ vars.NEON_PARENT_BRANCH || 'staging' }}
        run: |
          url=$(bunx neonctl@2 connection-string "$BRANCH" --project-id "$PROJECT_ID" --api-key "$NEON_API_KEY")
          echo "::add-mask::$url"
          echo "db_url=$url" >> "$GITHUB_OUTPUT"

      - name: Migrate the staging database
        working-directory: packages/db
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
        run: bunx drizzle-kit migrate

      # Idempotent: creates the CADEV 2026 once and never overwrites what an Admin edited (#61).
      - name: Seed the staging database
        working-directory: packages/db
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
        run: bun src/seed/index.ts

  # DEPLOY: publishes the built Worker against the migrated database, then checks it answers.
  deploy:
    name: Deploy staging
    needs: [database, build, e2e]
    # always(): a failed or skipped stage must turn THIS job red, not leave it « skipped ».
    if: always() && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: preview
    steps:
      - name: Require the database, the build and the journeys
        env:
          DATABASE: ${{ needs.database.result }}
          BUILD: ${{ needs.build.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          if [ "$DATABASE" != "success" ] || [ "$BUILD" != "success" ] || [ "$E2E" != "success" ]; then
            echo "::error::Not deployed: database is '$DATABASE', build is '$BUILD', e2e is '$E2E'."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      # Retried: a cold cache re-downloads everything and can hit rate limits (infra, not code).
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            bun install --frozen-lockfile --ignore-scripts && exit 0
            echo "::warning::install attempt $attempt failed, retrying"
            sleep 15
          done
          exit 1
      - run: bun run env:generate

      - uses: actions/download-artifact@v4
        with:
          name: staging-worker
          path: apps/web/.open-next

      - name: Staging database URL
        id: neon
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          BRANCH: ${{ vars.NEON_PARENT_BRANCH || 'staging' }}
        run: |
          url=$(bunx neonctl@2 connection-string "$BRANCH" --project-id "$PROJECT_ID" --api-key "$NEON_API_KEY")
          echo "::add-mask::$url"
          echo "db_url=$url" >> "$GITHUB_OUTPUT"

      - name: Deploy
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
          BETTER_AUTH_SECRET: ${{ secrets.PREVIEW_BETTER_AUTH_SECRET }}
          OAUTH_PROXY_SECRET: ${{ secrets.PREVIEW_OAUTH_PROXY_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.PREVIEW_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.PREVIEW_GITHUB_CLIENT_SECRET }}
          GITLAB_CLIENT_ID: ${{ secrets.PREVIEW_GITLAB_CLIENT_ID }}
          GITLAB_CLIENT_SECRET: ${{ secrets.PREVIEW_GITLAB_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.PREVIEW_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.PREVIEW_GOOGLE_CLIENT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # Signing secret of the Resend webhook (#200); unset = /webhooks/resend not mounted.
          RESEND_WEBHOOK_SECRET: ${{ secrets.RESEND_WEBHOOK_SECRET }}
          # Sender on the domain verified in Resend; unset = email stays disabled. Written to the
          # secrets file, not --var: its "<address>" breaks when wrangler is re-run by a shell.
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          # Official social accounts (#265, #266). Each one unset is left out; the feature stays
          # off until the encryption secret AND an application's client id are set.
          SOCIAL_CREDENTIALS_SECRET: ${{ secrets.SOCIAL_CREDENTIALS_SECRET }}
          X_CLIENT_ID: ${{ vars.X_CLIENT_ID }}
          X_CLIENT_SECRET: ${{ secrets.X_CLIENT_SECRET }}
          LINKEDIN_CLIENT_ID: ${{ vars.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          LINKEDIN_API_VERSION: ${{ vars.LINKEDIN_API_VERSION }}
          LINKEDIN_AUTHOR: ${{ vars.LINKEDIN_AUTHOR }}
          BLUESKY_IDENTIFIER: ${{ vars.BLUESKY_IDENTIFIER }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          # Staff roles (#120): comma-separated verified emails, re-read at every sign-in. Without
          # them every account is demoted to Member at its next sign-in.
          SUPER_ADMIN_EMAILS: ${{ secrets.SUPER_ADMIN_EMAILS }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          MODERATOR_EMAILS: ${{ secrets.MODERATOR_EMAILS }}
        run: |
          # Secrets go through a file, never the command line; removed right after.
          umask 077
          node ../../scripts/preview-secrets.mjs staging-secrets.json
          bunx wrangler deploy --env staging \
            --message "${GITHUB_SHA::7}" \
            --var "BETTER_AUTH_URL:$ORIGIN" \
            --var "CORS_ORIGIN:$ORIGIN" \
            --var "OAUTH_PROXY_PRODUCTION_URL:$ORIGIN" \
            --var "EMAIL_OTP_SIGNIN:true" \
            --var "PUBLIC_SITE_URL:$ORIGIN" \
            --var "GIT_SHA:${GITHUB_SHA::7}" \
            --secrets-file staging-secrets.json
          rm -f staging-secrets.json

      # Liveness (#106): GET /api/v1/health must answer 200. Bot Fight Mode challenges GitHub
      # runners (403 + cf-mitigated): reachable but unchecked, flagged as a warning until the
      # staging host is exempted (docs/staging.md).
      - name: Check /api/v1/health
        run: |
          for attempt in $(seq 1 30); do
            headers=$(curl -sS -m 10 -o /dev/null -D - "$ORIGIN/api/v1/health" || true)
            status=$(printf '%s' "$headers" | awk 'toupper($1) ~ /^HTTP/ {code=$2} END {print code}')
            if [ "$status" = "200" ]; then
              echo "healthy after $attempt attempt(s)"
              exit 0
            fi
            if [ "$status" = "403" ] && printf '%s' "$headers" | grep -qi '^cf-mitigated: *challenge'; then
              echo "::warning::health not checked: Cloudflare challenged the runner (see docs/staging.md)"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$ORIGIN/api/v1/health did not answer 200 within 5 minutes (last status: ${status:-none})"
          exit 1
